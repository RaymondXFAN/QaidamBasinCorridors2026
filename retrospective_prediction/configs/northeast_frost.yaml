# ============================================================
# 冻土-基础设施沉降预测实验 - 备选配置2
# 东北冻土区域
# ============================================================

# AutoDL云端路径策略：
#   数据盘 /root/autodl-tmp (/dev/md0挂载点，大容量)
#   代码可放系统盘 /root，数据和输出必须放数据盘
#   DATA_ROOT自动检测：--data-root > $DATA_ROOT > /root/autodl-tmp > 项目根目录
#   运行时路径解析：datasets/processed → DATA_ROOT/datasets/processed
#                   outputs → DATA_ROOT/outputs
#   GPU环境：RTX4090 | CUDA 13.0(driver) | PyTorch 2.4+cu12.4 | Python 3.12

dataset_name: "northeast_frost"
data_source: "simulation"          # 后续改为 NCDC A5 URL
region: "Northeast China Permafrost"
description: "东北冻土工程基础稳定性预测"

# 数据维度
N_nodes: 25                        # 东北冻土监测点数
T_steps: 120                       # 10年×12月=120月
F_features: 12
G_geo_features: 3
T_in: 24
T_out: 1
train_ratio: 0.8

# 随机种子
seed: 42

# 仿真数据参数
noise_level: 0.04                  # 东北监测较完善
k_thaw: 1.5                        # 东北土壤热导率不同 (W/m·K)

# 物理损失权重
lambda_phys: 0.25

# 模型参数
hidden_dim: 64
num_heads: 4
num_spatial_layers: 2
dropout: 0.1

# 训练参数
epochs: 200
lr: 0.001
batch_size: 32

# 空间邻接矩阵
adj_threshold_km: 50

# FiLM conditioning
use_film: true
use_phys_loss: true

# 输出目录
output_dir: "outputs"
data_dir: "datasets/processed"
raw_data_dir: "datasets/raw"

# Baseline对比模型列表
baselines:
  - st_gat
  - stgcn
  - dcrnn
  - pinn
  - stefan
  - rf
  - gbrt
