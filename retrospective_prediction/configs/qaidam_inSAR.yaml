# ============================================================
# 冻土-基础设施沉降预测实验 - 主配置
# 柴达木盆地走廊 InSAR 形变数据集
# ============================================================

# AutoDL云端路径策略：
#   数据盘 /root/autodl-tmp (/dev/md0挂载点，大容量)
#   代码可放系统盘 /root，数据和输出必须放数据盘
#   DATA_ROOT自动检测：--data-root > $DATA_ROOT > /root/autodl-tmp > 项目根目录
#   运行时路径解析：datasets/processed → DATA_ROOT/datasets/processed
#                   outputs → DATA_ROOT/outputs
#   GPU环境：RTX4090 | CUDA 13.0(driver) | PyTorch 2.4+cu12.4 | Python 3.12

dataset_name: "qaidam_inSAR"
data_source: "simulation"          # 初始用仿真，后续改为 download URL
region: "Qaidam Basin Corridor"
description: "柴达木盆地走廊冻土InSAR形变+沉降预测"

# 数据维度
N_nodes: 47                        # 对应论文47钻孔
T_steps: 120                       # 10年×12月=120月
F_features: 12                     # 12维特征（严格对应EXPERIMENT_DESIGN.md）
G_geo_features: 3                  # FiLM conditioning先验维度
T_in: 24                           # 输入24个月
T_out: 1                           # 预测1个月沉降
train_ratio: 0.8                   # 训练集比例

# 随机种子（可复现）
seed: 42

# 仿真数据参数
noise_level: 0.05                  # InSAR噪声水平
k_thaw: 1.2                        # Stefan方程热导率 (W/m·K)

# 物理损失权重
lambda_phys: 0.3                   # 物理约束损失系数

# 模型参数
hidden_dim: 64
num_heads: 4
num_spatial_layers: 2
dropout: 0.1

# 训练参数
epochs: 200
lr: 0.001
batch_size: 32

# 空间邻接矩阵
adj_threshold_km: 50               # 50km内连线

# FiLM conditioning
use_film: true
use_phys_loss: true

# 输出目录
output_dir: "outputs"
data_dir: "datasets/processed"
raw_data_dir: "datasets/raw"

# Baseline对比模型列表
baselines:
  - st_gat
  - stgcn
  - dcrnn
  - pinn
  - stefan
  - rf
  - gbrt
