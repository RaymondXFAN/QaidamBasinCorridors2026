# ============================================================
# 冻土-基础设施沉降预测实验 - 备选配置3
# 野牛沟 黑河流域
# ============================================================

# AutoDL云端路径策略：
#   数据盘 /root/autodl-tmp (/dev/md0挂载点，大容量)
#   代码可放系统盘 /root，数据和输出必须放数据盘
#   DATA_ROOT自动检测：--data-root > $DATA_ROOT > /root/autodl-tmp > 项目根目录
#   运行时路径解析：datasets/processed → DATA_ROOT/datasets/processed
#                   outputs → DATA_ROOT/outputs
#   GPU环境：RTX4090 | CUDA 13.0(driver) | PyTorch 2.4+cu12.4 | Python 3.12

dataset_name: "yeniugou_alt"
data_source: "simulation"          # 后续改为 TPDC A8 URL
region: "Yeniugou Heihe Basin"
description: "野牛沟黑河流域冻土形变+ALT预测"

# 数据维度
N_nodes: 15                        # 野牛沟监测点数较少
T_steps: 120                       # 10年×12月=120月
F_features: 12
G_geo_features: 3
T_in: 24
T_out: 1
train_ratio: 0.8

# 随机种子
seed: 42

# 仿真数据参数
noise_level: 0.07                  # 野牛沟数据噪声较高
k_thaw: 1.1                        # 黑河流域热导率 (W/m·K)

# 物理损失权重
lambda_phys: 0.35                  # 小数据集更依赖物理约束

# 模型参数
hidden_dim: 48                     # 小数据集用较小模型
num_heads: 4
num_spatial_layers: 2
dropout: 0.15                      # 小数据集dropout略高

# 训练参数
epochs: 250                        # 小数据集训练更多轮
lr: 0.0005                         # 小数据集学习率稍低
batch_size: 16                     # 小数据集batch更小

# 空间邻接矩阵
adj_threshold_km: 40               # 小区域阈值降低

# FiLM conditioning
use_film: true
use_phys_loss: true

# 输出目录
output_dir: "outputs"
data_dir: "datasets/processed"
raw_data_dir: "datasets/raw"

# Baseline对比模型列表
baselines:
  - st_gat
  - stgcn
  - dcrnn
  - pinn
  - stefan
  - rf
  - gbrt
